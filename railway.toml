[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# AFFiNE's supported self-host migration performs both Prisma and data migrations.
preDeployCommand = "node ./scripts/self-host-predeploy.js"
startCommand = "/app/scripts/start-afluence.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
